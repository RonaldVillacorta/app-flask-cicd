name: Deploy in Azure
run-name: Deploy for {{github.actor}} on {{github.ref_name}}

on:
  push:
    branches:
        - main

#env: myregistry.azurecr.io/my-app:v1
env: 
  IMAGE_NAME: ${{ vars.ACR_NAME }}.azurecr.io/repo/flask-app

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout code
          uses: actions/checkout@v7

        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v4

        
        - name: Login to Azure
          uses: azure/login@v3
          with:
            client-id: ${{ vars.AZURE_CLIENT_ID }}
            tenant-id: ${{ vars.AZURE_TENANT_ID }}
            subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        - name: Get ACR access token
          id: acr-token
          run: |
            ACR_TOKEN=$(az acr login --name ${{ vars.ACR_NAME }} --expose-token --output tsv --query accessToken)
            echo "::add-mask::$ACR_TOKEN" # mask the token in workflow logs
            echo "token=$ACR_TOKEN" >> "$GITHUB_OUTPUT"
        - name: Login to ACR
          uses: docker/login-action@v4
          with:
            registry: ${{ vars.ACR_NAME}}.azurecr.io
            username: 00000000-0000-0000-0000-000000000000
            password: ${{ steps.acr-token.outputs.token }}

        - name: Build and Push Docker Image
          uses: docker/build-push-action@v7
          with:
            context: .
            build-args: |
              BUILD_TAG=v${{ github.run_number }}
            tags: |
              ${{ env.IMAGE_NAME }}:v${{ github.run_number }}
              ${{ env.IMAGE_NAME }}:latest
            push: true
            cache-from: |
              type=gha
              type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
            cache-to: |
              type=gha,mode=max
              type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          images: ${{ env.IMAGE_NAME }}:latest
