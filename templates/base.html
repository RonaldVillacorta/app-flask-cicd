<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Flask App Demo{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #0f172a;
            color: #f1f5f9;
        }
        .navbar {
            background-color: #1e293b !important;
            border-bottom: 1px solid #334155;
        }
        .card {
            background-color: #1e293b;
            border: 1px solid #334155;
        }
        .table {
            --bs-table-bg: transparent;
            --bs-table-color: #f1f5f9;
            --bs-table-border-color: #334155;
        }
        footer {
            margin-top: auto;
            background-color: #1e293b;
            border-top: 1px solid #334155;
        }
        .badge-status-Activo { background-color: #10b981; }
        .badge-status-En\ Mantenimiento { background-color: #f59e0b; color: #000; }
        .badge-status-Pendiente { background-color: #6366f1; }
        .badge-status-Deprecado { background-color: #ef4444; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">
                <i class="bi bi-box-seam text-primary me-2"></i>Flask MicroApp
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/' %}active fw-semibold text-primary{% endif %}" href="/">
                            <i class="bi bi-speedometer2 me-1"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/items' %}active fw-semibold text-primary{% endif %}" href="/items">
                            <i class="bi bi-database me-1"></i> Datos Demo
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/runtime' %}active fw-semibold text-primary{% endif %}" href="/runtime">
                            <i class="bi bi-cpu me-1"></i> Runtime & Info
                        </a>
                    </li>
                </ul>
                <div class="d-flex align-items-center gap-2">
                    <a href="/health" target="_blank" class="btn btn-sm btn-outline-success">
                        <i class="bi bi-heart-pulse me-1"></i> Health Check
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <main class="container my-4 flex-grow-1">
        {% block content %}{% endblock %}
    </main>

    <footer class="py-3 text-center text-secondary small">
        <div class="container d-flex justify-content-between align-items-center">
            <span>Flask CI/CD Template &bull; Diseñado para Docker & Azure ACR / App Service</span>
            <span class="badge bg-secondary-subtle text-light border border-secondary">
                <i class="bi bi-code-slash me-1"></i> Python 3.12 + Gunicorn
            </span>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
